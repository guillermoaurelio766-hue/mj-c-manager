
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJ C Manager</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
  }
  main {
    max-width: 650px;
    margin: auto;
  }
  h1 { color: #1ed760; }
  input, textarea, button {
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #444;
    font-size: 15px;
  }
  input, textarea {
    background: #222;
    color: white;
  }
  textarea { min-height: 130px; }
  button {
    background: #1ed760;
    color: #111;
    border: 0;
    font-weight: bold;
  }
  button:disabled { opacity: .5; }
  .secondary {
    background: #333;
    color: white;
  }
  #status {
    color: #1ed760;
    white-space: pre-wrap;
    margin: 15px 0;
  }
  #songlist {
    white-space: pre-wrap;
    background: #202020;
    padding: 14px;
    border-radius: 8px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  .small { color: #aaa; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>MJ C Manager</h1>
  <p>Administra tu playlist de Michael Jackson.</p>

  <button id="login">Conectar Spotify</button>
  <button id="logout" class="secondary" hidden>Desconectar</button>

  <section id="manager" hidden>
    <h2>Mi playlist</h2>

    <label for="playlist">ID de la playlist</label>
    <input id="playlist"
      value="1DMcEcjwR8WI3AocSz1FgZ">

    <button id="view" class="secondary">
      Ver canciones
    </button>

    <div id="status">Esperando conexión...</div>
    <pre id="songlist">Tus canciones aparecerán aquí.</pre>

    <h2>Agregar canciones</h2>
    <p class="small">
      Pega enlaces o URI de Spotify, uno por línea.
    </p>
    <textarea id="songs"
      placeholder="https://open.spotify.com/track/..."></textarea>

    <button id="add">Agregar canciones</button>
  </section>
</main>

<script>
const CLIENT_ID = "22f2dd29d5f44c3ba77c6a26c1bde6ea";
const REDIRECT_URI =
  "https://guillermoaurelio766-hue.github.io/mj-c-manager/";

const SCOPES = [
  "playlist-read-private",
  "playlist-read-collaborative",
  "playlist-modify-public",
  "playlist-modify-private"
].join(" ");

const $ = id => document.getElementById(id);

function status(message) {
  $("status").textContent = message;
}

function randomString(length) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const bytes = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(bytes, b => chars[b % chars.length]).join("");
}

function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function sha256(value) {
  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(value)
  );
}

async function login() {
  try {
    const verifier = randomString(64);
    const state = randomString(24);
    const challenge = base64url(await sha256(verifier));

    localStorage.setItem("pkce_verifier", verifier);
    localStorage.setItem("oauth_state", state);

    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      state,
      code_challenge_method: "S256",
      code_challenge: challenge
    });

    window.location.assign(
      "https://accounts.spotify.com/authorize?" + params
    );
  } catch (error) {
    status("No se pudo iniciar la conexión: " + error.message);
  }
}

function saveToken(data) {
  sessionStorage.setItem("access_token", data.access_token);

  if (data.refresh_token) {
    sessionStorage.setItem("refresh_token", data.refresh_token);
  }

  sessionStorage.setItem(
    "expires_at",
    String(Date.now() + data.expires_in * 1000)
  );
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem("pkce_verifier");

  if (!verifier) {
    throw new Error("No se encontró el código de verificación. Conecta Spotify otra vez.");
  }

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error_description || data.error || "Error al obtener el acceso.");
  }

  saveToken(data);
  localStorage.removeItem("pkce_verifier");
  localStorage.removeItem("oauth_state");
}

async function refreshToken() {
  const refresh = sessionStorage.getItem("refresh_token");

  if (!refresh) {
    throw new Error("La sesión venció. Conecta Spotify de nuevo.");
  }

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refresh
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error_description || "No se pudo renovar la sesión.");
  }

  saveToken(data);
}

async function api(url, options = {}, retry = true) {
  let token = sessionStorage.getItem("access_token");

  if (!token) {
    throw new Error("Primero conecta Spotify.");
  }

  const response = await fetch(url, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: "Bearer " + token
    }
  });

  if (response.status === 401 && retry) {
    await refreshToken();
    return api(url, options, false);
  }

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error?.message ||
      data.error_description ||
      "Spotify respondió con el error " + response.status
    );
  }

  return data;
}

function playlistId() {
  const value = $("playlist").value.trim();
  const match = value.match(/playlist\/([a-zA-Z0-9]+)/);

  return match ? match[1] : value;
}

async function getAllItems() {
  const id = playlistId();

  if (!id) throw new Error("Escribe el ID de tu playlist.");

  let url =
    "https://api.spotify.com/v1/playlists/" +
    encodeURIComponent(id) + "/items?limit=50";

  const all = [];

  while (url) {
    const data = await api(url);
    all.push(...(data.items || []));
    url = data.next || null;
  }

  return all;
}

async function viewSongs() {
  try {
    status("Cargando canciones...");
    $("songlist").textContent = "";

    const items = await getAllItems();

    const tracks = items
      .map(entry => entry.item || entry.track)
      .filter(item => item && item.type === "track");

    $("songlist").textContent = tracks.length
      ? tracks.map((track, index) =>
          `${index + 1}. ${track.name} — ${
            (track.artists || []).map(a => a.name).join(", ")
          }`
        ).join("\n")
      : "No se encontraron canciones.";

    status("Se encontraron " + tracks.length + " canciones.");
  } catch (error) {
    status("Error: " + error.message);
  }
}

function toTrackUri(value) {
  const text = value.trim();
  if (!text) return null;

  if (/^spotify:track:[a-zA-Z0-9]+$/.test(text)) {
    return text;
  }

  const match = text.match(
    /open\.spotify\.com\/track\/([a-zA-Z0-9]+)/
  );

  if (match) return "spotify:track:" + match[1];

  return null;
}

async function addSongs() {
  try {
    const lines = $("songs").value
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean);

    const inputUris = lines.map(toTrackUri);

    const invalid = lines.filter((line, index) => !inputUris[index]);

    if (invalid.length) {
      throw new Error(
        "Hay enlaces no válidos. Usa enlaces de canciones de Spotify, uno por línea."
      );
    }

    const uniqueInput = [...new Set(inputUris)];

    if (!uniqueInput.length) {
      throw new Error("Pega al menos un enlace de canción.");
    }

    status("Revisando canciones existentes...");

    const currentItems = await getAllItems();

    const existing = new Set(
      currentItems
        .map(entry => entry.item || entry.track)
        .filter(item => item && item.uri)
        .map(item => item.uri)
    );

    const newUris = uniqueInput.filter(uri => !existing.has(uri));

    if (!newUris.length) {
      status("Todas esas canciones ya están en tu playlist.");
      return;
    }

    status("Agregando " + newUris.length + " canciones...");

    const id = playlistId();

    for (let i = 0; i < newUris.length; i += 100) {
      const batch = newUris.slice(i, i + 100);

      await api(
        "https://api.spotify.com/v1/playlists/" +
        encodeURIComponent(id) + "/items",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uris: batch })
        }
      );
    }

    $("songs").value = "";
    status(
      "¡Listo! Se agregaron " + newUris.length +
      " canciones. Se omitieron " +
      (uniqueInput.length - newUris.length) + " repetidas."
    );

    await viewSongs();

  } catch (error) {
    status("Error: " + error.message);
  }
}

function showManager() {
  $("manager").hidden = false;
  $("login").hidden = true;
  $("logout").hidden = false;
}

function logout() {
  sessionStorage.clear();
  localStorage.removeItem("pkce_verifier");
  localStorage.removeItem("oauth_state");
  $("manager").hidden = true;
  $("login").hidden = false;
  $("logout").hidden = true;
  status("Sesión desconectada.");
}

async function initialize() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if (error) {
    status("Spotify canceló la conexión: " + error);
    history.replaceState({}, document.title, REDIRECT_URI);
    return;
  }

  if (code) {
    const savedState = localStorage.getItem("oauth_state");

    if (!savedState || returnedState !== savedState) {
      status("No se pudo verificar la conexión. Inténtalo otra vez.");
      history.replaceState({}, document.title, REDIRECT_URI);
      return;
    }

    try {
      status("Conectando con Spotify...");
      await exchangeCode(code);
      history.replaceState({}, document.title, REDIRECT_URI);
      showManager();
      status("¡Spotify conectado! Ya puedes ver tu playlist.");
    } catch (error) {
      status("Error de conexión: " + error.message);
      history.replaceState({}, document.title, REDIRECT_URI);
    }
    return;
  }

  if (sessionStorage.getItem("access_token")) {
    showManager();
    status("Sesión recuperada. Spotify está conectado.");
  }
}

$("login").addEventListener("click", login);
$("logout").addEventListener("click", logout);
$("view").addEventListener("click", viewSongs);
$("add").addEventListener("click", addSongs);

initialize();
</script>
</body>
</html>
